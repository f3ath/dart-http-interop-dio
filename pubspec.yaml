name: http_interop_dio
description: >-
  Send http_interop requests through Dio with streamed request and response bodies,
  while honoring Dio's client configuration and interceptors.
version: 0.3.0
repository: https://github.com/f3ath/dart-http-interop-dio

environment:
  sdk: ^3.13.0

dependencies:
  http_interop: ^3.0.0
  dio: ^5.0.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.21.1
  check_coverage: ^0.0.2
  cider: ^0.2.0

cider:
  link_template:
    tag: 'https://github.com/f3ath/dart-http-interop-dio/releases/tag/%tag%'
    diff: 'https://github.com/f3ath/dart-http-interop-dio/compare/%from%...%to%'
